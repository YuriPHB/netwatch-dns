<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetWatch — entrar</title>
<style>
  :root{
    --bg:#0a0e13; --panel:#111821; --panel-2:#0d141c; --line:#1e2a36;
    --text:#e6edf5; --muted:#8296a8; --accent:#38bdf8; --red:#f87171;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    background:radial-gradient(1000px 600px at 50% -20%, #10202e 0%, var(--bg) 60%);
    color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  }
  .card{
    width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel),var(--panel-2));
    border:1px solid var(--line);border-radius:18px;padding:26px 24px 22px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .logo{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#04121a;font-weight:800;
  }
  h1{font-size:17px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px}
  label{display:block;font-size:12px;color:var(--muted);margin:14px 0 6px;letter-spacing:.4px;text-transform:uppercase}
  input{
    width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0a1118;color:var(--text);font-size:15px;outline:none;
  }
  input:focus{border-color:#2b5a75;box-shadow:0 0 0 3px rgba(56,189,248,.14)}
  button{
    width:100%;margin-top:18px;padding:11px 14px;border-radius:10px;border:0;cursor:pointer;
    background:linear-gradient(135deg,#0ea5e9,#22d3ee);color:#04121a;font-weight:700;font-size:14.5px;
  }
  button:disabled{opacity:.6;cursor:progress}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:#34d399}
  .foot{margin-top:20px;color:#5d7387;font-size:11.6px;line-height:1.6}
  .lock{margin-left:auto;color:#3f566a}
</style>
</head>
<body>
<form class="card" id="form" autocomplete="off">
  <div class="brand">
    <div class="logo">N</div>
    <div>
      <h1>NetWatch</h1>
      <div class="sub">Acesso restrito ao painel</div>
    </div>
    <div class="lock" aria-hidden="true">🔒</div>
  </div>

  <label for="password">Senha</label>
  <input type="password" id="password" name="password" autocomplete="current-password"
         autofocus placeholder="digite a senha do painel">
  <button id="btn" type="submit">Entrar</button>
  <div class="msg" id="msg"></div>

  <div class="foot">
    Tentativas de acesso (com IP e horário) ficam registradas na auditoria.
    A senha é guardada apenas como hash scrypt — nem quem opera o servidor consegue lê-la.
  </div>
</form>

<script>
const form = document.getElementById('form');
const pwd = document.getElementById('password');
const btn = document.getElementById('btn');
const msg = document.getElementById('msg');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  msg.className = 'msg';
  msg.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({password: pwd.value})
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok && data.ok){
      msg.className = 'msg ok';
      msg.textContent = 'ok — abrindo painel…';
      location.href = '/';
      return;
    }
    msg.className = 'msg err';
    msg.textContent = data.error || 'Não foi possível entrar.';
    pwd.select();
  } catch (err){
    msg.className = 'msg err';
    msg.textContent = 'Servidor indisponível. Verifique se o NetWatch está rodando.';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
